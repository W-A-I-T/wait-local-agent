services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      WAIT_DATA_PATH: /data/state.db
      WAIT_ALLOWED_DOC_ROOT: /app/examples/sample_docs
      WAIT_DEMO_MODE: ${WAIT_DEMO_MODE:-false}
      WAIT_ADMIN_TOKEN: ${WAIT_ADMIN_TOKEN:-}
      WAIT_API_TOKEN: ${WAIT_API_TOKEN:-}
      WAIT_CLIENT_ID: ${WAIT_CLIENT_ID:-}
      WAIT_SECRETS_BACKEND: env
      WAIT_VAULT_KEY: ${WAIT_VAULT_KEY:-}
      WAIT_VAULT_PATH: /data/vault
      WAIT_TRUSTED_HOSTS: 127.0.0.1,localhost,api
    command: ["wait-local-agent", "serve", "--host", "0.0.0.0", "--port", "8788"]
    ports:
      - "127.0.0.1:${WAIT_COMPOSE_API_PORT:-8788}:8788"
    volumes:
      - wait-local-agent-data:/data
      - wait-local-agent-backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-host-collect:
    build: .
    env_file:
      - path: .env
        required: false
    profiles:
      - host-collect
    pid: host
    network_mode: host
    environment:
      WAIT_DATA_PATH: /data/state.db
      WAIT_ALLOWED_DOC_ROOT: /app/examples/sample_docs
      WAIT_DEMO_MODE: ${WAIT_DEMO_MODE:-false}
      WAIT_ADMIN_TOKEN: ${WAIT_ADMIN_TOKEN:-}
      WAIT_API_TOKEN: ${WAIT_API_TOKEN:-}
      WAIT_SECRETS_BACKEND: env
      WAIT_VAULT_KEY: ${WAIT_VAULT_KEY:-}
      WAIT_VAULT_PATH: /data/vault
      WAIT_TRUSTED_HOSTS: 127.0.0.1,localhost,api
      WAIT_COLLECTION_SCOPE: host
      WAIT_HOST_ROOT: /host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - wait-local-agent-data:/data
      - wait-local-agent-backups:/backups
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro

  ui:
    image: node:22-slim
    working_dir: /app/ui
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8788
    ports:
      - "127.0.0.1:${WAIT_COMPOSE_UI_PORT:-5173}:5173"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy

volumes:
  wait-local-agent-data:
  wait-local-agent-backups:
