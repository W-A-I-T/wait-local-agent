[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wait-local-agent"
version = "2.0.0rc1"
description = "Local-first AI copilot runtime for MSPs and SMBs."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "ADDITIONAL_TERMS.md", "NOTICE", "LICENSES/*"]
authors = [{ name = "WAIT" }]
dependencies = [
  "APScheduler==3.11.3",
  "aiohttp>=3.14.3,<4.0",
  "azure-identity==1.25.3",
  "azure-mgmt-authorization==4.0.0",
  "azure-mgmt-compute==38.3.0",
  "azure-mgmt-network==32.0.0",
  "azure-mgmt-storage==25.1.0",
  "boto3>=1.43.51,<2.0",
  "cryptography>=50.0.0,<51",
  "defusedxml>=0.7,<1.0",
  "fastapi>=0.139.0,<1.0",
  "google-cloud-compute==1.50.0",
  "google-cloud-iam==2.24.1",
  "google-cloud-resource-manager==1.18.0",
  "google-cloud-storage==3.13.1",
  "h2>=4.4.1,<5.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "msgraph-sdk==1.61.0",
  "pypdf>=6.15.0,<7.0",
  "reportlab>=4.2,<6.0",
  "slowapi>=0.1.10,<0.2",
  "typer>=0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
docling = [
  "docling>=2,<3",
]
qdrant = [
  "fastembed>=0.4,<1",
  "qdrant-client>=1.12,<2",
]
knowledge = [
  "docling>=2,<3",
  "fastembed>=0.4,<1",
  "qdrant-client>=1.12,<2",
]
desktop = [
  "pyinstaller==6.22.2",
]
dev = [
  "bandit>=1.7,<2.0",
  "mypy>=1.13,<3.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
wait-local-agent = "wait_local_agent.cli:app"
wait-local-agent-server = "wait_local_agent.api.server_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wait_local_agent", "src/packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wait_local_agent", "packs"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
constraint-dependencies = [
  "idna>=3.15",
  "msgpack>=1.2.1",
  "starlette>=1.3.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "tests"
exclude = ["^tests/microsoft_admin_support\\.py$"]
check_untyped_defs = true
disable_error_code = ["no-untyped-def"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "docling.*", "fastembed.*", "qdrant_client.*", "reportlab.*"]
ignore_missing_imports = true
