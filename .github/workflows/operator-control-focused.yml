name: operator control focused

on:
  push:
    branches:
      - feat/operator-lifecycle-and-activity
    paths:
      - ".github/workflows/operator-control-focused.yml"

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Capture focused result
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_operator_control.py --tb=short > .operator-control-focused.txt 2>&1
          status=$?
          echo >> .operator-control-focused.txt
          echo "PYTEST_EXIT_CODE=${status}" >> .operator-control-focused.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .operator-control-focused.txt
          git commit -m "chore(ci): capture focused operator-control result" || true
          git push origin HEAD:feat/operator-lifecycle-and-activity
          exit 0
