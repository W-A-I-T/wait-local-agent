name: fix discovery formatting

on:
  push:
    branches:
      - feat/historical-automation-discovery
    paths:
      - ".github/workflows/fix-discovery-format.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply targeted source formatting fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path("src/packs/automation_discovery/router.py")
          text = router.read_text(encoding="utf-8")
          text = text.replace(
              '                raise HTTPException(status_code=400, detail=f"ticket is not in the selected client scope: {item.ticket_id}")',
              '                raise HTTPException(\n'
              '                    status_code=400,\n'
              '                    detail=f"ticket is not in the selected client scope: {item.ticket_id}",\n'
              '                )',
          )
          text = text.replace(
              '                    detail=f"connector is not verified or client-bound for the selected client: {item.connector_instance_id}",',
              '                    detail=(\n'
              '                        "connector is not verified or client-bound for the selected client: "\n'
              '                        f"{item.connector_instance_id}"\n'
              '                    ),',
          )
          router.write_text(text, encoding="utf-8")

          service = Path("src/packs/automation_discovery/service.py")
          text = service.read_text(encoding="utf-8")
          text = text.replace(
              'from collections import Counter, defaultdict\nfrom dataclasses import asdict, dataclass\nfrom datetime import UTC, datetime, timedelta\nfrom typing import Any, Iterable',
              'from collections import Counter, defaultdict\nfrom collections.abc import Iterable\nfrom dataclasses import asdict, dataclass\nfrom datetime import UTC, datetime, timedelta\nfrom typing import Any',
          )
          text = text.replace(
              '                "priority_counts": dict(sorted(Counter(ticket.priority.strip().lower() or "unknown" for ticket in members).items())),',
              '                "priority_counts": dict(\n'
              '                    sorted(\n'
              '                        Counter(ticket.priority.strip().lower() or "unknown" for ticket in members).items()\n'
              '                    )\n'
              '                ),',
          )
          text = text.replace(
              '    if any(token in normalized for token in ("rmm", "ninja", "datto", "ncentral", "n-central", "nsight", "n-sight", "kaseya", "screenconnect", "automate", "asio")):\n',
              '    rmm_tokens = (\n'
              '        "rmm", "ninja", "datto", "ncentral", "n-central", "nsight", "n-sight",\n'
              '        "kaseya", "screenconnect", "automate", "asio",\n'
              '    )\n'
              '    if any(token in normalized for token in rmm_tokens):\n',
          )
          text = text.replace(
              '    if any(token in normalized for token in ("itglue", "it-glue", "hudu", "confluence", "sharepoint", "notion", "lexful")):\n',
              '    documentation_tokens = (\n'
              '        "itglue", "it-glue", "hudu", "confluence", "sharepoint", "notion", "lexful",\n'
              '    )\n'
              '    if any(token in normalized for token in documentation_tokens):\n',
          )
          text = text.replace(
              '    if any(token in normalized for token in ("huntress", "threatlocker", "defender", "sentinel", "crowdstrike", "sophos")):\n',
              '    security_tokens = ("huntress", "threatlocker", "defender", "sentinel", "crowdstrike", "sophos")\n'
              '    if any(token in normalized for token in security_tokens):\n',
          )
          service.write_text(text, encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.5"
          ruff check src/packs/automation_discovery tests/test_automation_discovery.py
          python -m compileall -q src/packs/automation_discovery tests/test_automation_discovery.py
          rm .github/workflows/fix-discovery-format.yml
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(discovery): satisfy backend lint rules"
          git push origin HEAD:feat/historical-automation-discovery
