name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: bandit -r src
      - run: pip-audit --skip-editable
      - run: python -m pytest --cov=wait_local_agent --cov=packs --cov-report=term-missing --cov-fail-under=95
      - run: bash -n scripts/demo_consultant_mode.sh
      - run: WAIT_DEMO_MODE=true WAIT_DATA_PATH="${RUNNER_TEMP}/wait-consultant-demo.db" bash scripts/demo_consultant_mode.sh
      - run: bash -n scripts/validate_local_first.sh
      - run: scripts/validate_local_first.sh
      - run: python scripts/public_surface_audit.py

  backend-windows:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest -q
          tests/test_observability.py
          tests/test_security_vault.py
          tests/test_config.py
          tests/test_power_platform_deployment.py
          tests/test_platform_support.py
          tests/test_fs_permissions.py
          tests/test_store_permissions.py
          tests/test_hardening_checks.py

  ui:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  desktop-pr:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install desktop check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf
      - run: python -m pip install -e ".[desktop]"
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: desktop
      - run: bash packaging/build-sidecar.sh
      - name: Verify capability packs in the sidecar
        if: ${{ hashFiles('src/packs/**') != '' }}
        run: |
          WAIT_DEMO_MODE=true \
          WAIT_DATA_PATH="${RUNNER_TEMP}/wait-sidecar-check.db" \
          WAIT_HOST=127.0.0.1 \
          WAIT_PORT=8788 \
          "${GITHUB_WORKSPACE}/dist/wait-local-agent-server" >"${RUNNER_TEMP}/wait-sidecar.log" 2>&1 &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/health >/dev/null; then
              break
            fi
            sleep 1
          done
          response="$(curl --fail --silent http://127.0.0.1:8788/packs/status)"
          python -c 'import json, sys; statuses = json.loads(sys.argv[1]); assert any(item.get("mounted_router") for item in statuses), statuses' "$response"
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  gitleaks:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository with the checked-in ignore policy
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:latest detect
          --source=/repo
          --no-banner
          --redact
          --exit-code=1
          --gitleaks-ignore-path=/repo/.gitleaksignore

  compose-browser:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: WAIT_COMPOSE_RUN_BROWSER=true scripts/test_compose_integration.sh

  prod-compose:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test_prod_compose.sh
