name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src tests
      - run: bandit -r src
      - run: pip-audit --skip-editable
      - run: python -m pytest --cov=wait_local_agent --cov-report=term-missing --cov-fail-under=95
      - run: bash -n scripts/demo_consultant_mode.sh
      - run: WAIT_DEMO_MODE=true WAIT_DATA_PATH="${RUNNER_TEMP}/wait-consultant-demo.db" bash scripts/demo_consultant_mode.sh
      - run: bash -n scripts/validate_local_first.sh
      - run: scripts/validate_local_first.sh
      - run: python scripts/public_surface_audit.py

  ui:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
