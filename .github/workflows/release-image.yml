name: release-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/w-a-i-t/wait-local-agent

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/check_release_version.py --tag "$RELEASE_TAG"
          else
            python scripts/check_release_version.py
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Calculate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image once for smoke test and publication
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: |
            wait-local-agent:smoke-${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test image before push
        env:
          SMOKE_IMAGE: wait-local-agent:smoke-${{ github.sha }}
          SMOKE_CONTAINER: wait-local-agent-smoke
        run: |
          set -euo pipefail
          trap 'docker rm --force "$SMOKE_CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$SMOKE_CONTAINER" \
            --publish 127.0.0.1:18788:8788 \
            --env WAIT_ADMIN_TOKEN=smoke-admin-token \
            --env WAIT_DEMO_MODE=false \
            --env WAIT_SECRETS_BACKEND=env \
            --env WAIT_SCHEDULER_ENABLED=false \
            --env WAIT_TRUSTED_HOSTS=127.0.0.1,localhost \
            "$SMOKE_IMAGE"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18788/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$SMOKE_CONTAINER"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:18788/healthz | grep -Fx '{"status":"ok"}'
          curl --fail --silent http://127.0.0.1:18788/ | grep -q 'id="root"'
          if docker exec "$SMOKE_CONTAINER" sh -c 'command -v node || command -v npm'; then
            echo "node/npm unexpectedly exists in the runtime image" >&2
            exit 1
          fi
          test "$(docker exec "$SMOKE_CONTAINER" id -u)" != "0"

      - name: Record smoke-tested image digest
        id: smoke
        env:
          SMOKE_IMAGE: wait-local-agent:smoke-${{ github.sha }}
        run: |
          set -euo pipefail
          smoke_digest="$(docker image inspect --format '{{.Id}}' "$SMOKE_IMAGE")"
          [[ "$smoke_digest" == sha256:* ]]
          echo "Smoke-tested image digest: $smoke_digest"
          echo "digest=$smoke_digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the smoke-tested image
        id: publish
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SMOKE_DIGEST: ${{ steps.smoke.outputs.digest }}
        run: |
          set -euo pipefail
          pushed_artifact_digest=""
          pushed_registry_digest=""
          while IFS= read -r image_tag; do
            [[ -z "$image_tag" ]] && continue
            push_output="$(docker image push "$image_tag" 2>&1)"
            printf '%s\n' "$push_output"
            registry_digest="$(printf '%s\n' "$push_output" | sed -n 's/.*digest: \(sha256:[[:xdigit:]]\{64\}\).*/\1/p' | tail -n 1)"
            artifact_digest="$(docker image inspect --format '{{.Id}}' "$image_tag")"
            if [[ -z "$registry_digest" || "$artifact_digest" != sha256:* ]]; then
              echo "could not determine the pushed digest for $image_tag" >&2
              exit 1
            fi
            if [[ -n "$pushed_artifact_digest" && "$pushed_artifact_digest" != "$artifact_digest" ]]; then
              echo "published tag artifacts differ: $pushed_artifact_digest versus $artifact_digest" >&2
              exit 1
            fi
            if [[ -n "$pushed_registry_digest" && "$pushed_registry_digest" != "$registry_digest" ]]; then
              echo "published registry digests differ: $pushed_registry_digest versus $registry_digest" >&2
              exit 1
            fi
            pushed_artifact_digest="$artifact_digest"
            pushed_registry_digest="$registry_digest"
          done <<< "$IMAGE_TAGS"

          test -n "$pushed_artifact_digest"
          echo "Smoke-tested image digest: $SMOKE_DIGEST"
          echo "Pushed image digest: $pushed_artifact_digest"
          echo "Pushed registry manifest digest: $pushed_registry_digest"
          test "$SMOKE_DIGEST" = "$pushed_artifact_digest"
          echo "digest=$pushed_registry_digest" >> "$GITHUB_OUTPUT"
          echo "Published image ${IMAGE_NAME}@${pushed_registry_digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign published image by digest
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
