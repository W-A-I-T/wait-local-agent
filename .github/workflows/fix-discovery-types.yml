name: fix discovery typing

on:
  push:
    branches:
      - feat/historical-automation-discovery
    paths:
      - ".github/workflows/fix-discovery-types.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply strict result typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/packs/automation_discovery/service.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              ') -> dict[str, object]:\n    """Rank recurring historical ticket families without enabling any automation."""': ') -> dict[str, Any]:\n    """Rank recurring historical ticket families without enabling any automation."""',
              'def build_mapping_readiness(store: Store, *, client_id: str) -> dict[str, object]:': 'def build_mapping_readiness(store: Store, *, client_id: str) -> dict[str, Any]:',
              '    mapping_readiness: dict[str, object],\n) -> dict[str, object]:': '    mapping_readiness: dict[str, Any],\n) -> dict[str, Any]:',
              ') -> list[dict[str, object]]:\n    buckets: dict[str, list[Ticket]]': ') -> list[dict[str, Any]]:\n    buckets: dict[str, list[Ticket]]',
              '    results: list[dict[str, object]] = []': '    results: list[dict[str, Any]] = []',
              '    mapping_readiness: dict[str, object],\n) -> list[dict[str, str]]:': '    mapping_readiness: dict[str, Any],\n) -> list[dict[str, str]]:',
              'def _opportunity_sort_key(item: dict[str, object]) -> tuple[int, int, str]:': 'def _opportunity_sort_key(item: dict[str, Any]) -> tuple[int, int, str]:',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source pattern not found: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install "mypy==2.3.1" "ruff==0.16.5"
          ruff check src/packs/automation_discovery tests/test_automation_discovery.py
          mypy src/packs/automation_discovery tests/test_automation_discovery.py
          rm .github/workflows/fix-discovery-types.yml
      - name: Commit typing corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(discovery): type nested discovery evidence"
          git push origin HEAD:feat/historical-automation-discovery
