name: operator control diagnostic

on:
  push:
    branches:
      - feat/operator-lifecycle-and-activity
    paths:
      - ".github/workflows/operator-control-diagnostic.yml"

permissions:
  contents: write

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Capture exact backend test failure
        shell: bash
        run: |
          set +e
          python -m pytest --cov=wait_local_agent --cov=packs --cov-report=term-missing --cov-fail-under=95 --tb=short > .operator-control-pytest.txt 2>&1
          status=$?
          echo >> .operator-control-pytest.txt
          echo "PYTEST_EXIT_CODE=${status}" >> .operator-control-pytest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .operator-control-pytest.txt
          git commit -m "chore(ci): capture operator-control pytest diagnostic" || true
          git push origin HEAD:feat/operator-lifecycle-and-activity
          exit 0
