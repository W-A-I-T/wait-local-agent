name: fix discovery typing v2

on:
  push:
    branches:
      - feat/historical-automation-discovery
    paths:
      - ".github/workflows/fix-discovery-types-v2.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply strict discovery result typing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("src/packs/automation_discovery/service.py")
          text = service.read_text(encoding="utf-8")
          text = text.replace("dict[str, object]", "dict[str, Any]")
          service.write_text(text, encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check src/packs/automation_discovery tests/test_automation_discovery.py
          mypy src tests
          rm -f .github/workflows/fix-discovery-types.yml
          rm -f .github/workflows/fix-discovery-types-v2.yml
      - name: Commit typing corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(discovery): type nested discovery evidence"
          git push origin HEAD:feat/historical-automation-discovery
